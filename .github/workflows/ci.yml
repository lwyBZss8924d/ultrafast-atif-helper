name: Offline source and package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      TYPESAFE_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: python3 scripts/distribution/test_package.py
      - run: python3 scripts/distribution/test_skill_docs.py
      - run: python3 scripts/distribution/skill-docs.py check
      - name: Verify independently installed Skill folder
        run: |
          python3 -c 'import os,pathlib,shutil; shutil.copytree("skills/ultrafast-atif-helper", pathlib.Path(os.environ["RUNNER_TEMP"])/"skill-only", symlinks=True)'
          python3 scripts/distribution/skill-docs.py links --skill-root "$RUNNER_TEMP/skill-only"
      - run: python3 scripts/distribution/package.py check
      - name: Build allowlisted public artifacts
        run: python3 scripts/distribution/package.py archive --output "$RUNNER_TEMP/public-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-source-and-plugin
          path: ${{ runner.temp }}/public-artifacts/*
          if-no-files-found: error
          retention-days: 7
