name: Explicit offline helper container smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t ultrafast-atif-helper:ci .
      - name: Inspect without network or credentials
        run: |
          docker run --rm --network none ultrafast-atif-helper:ci --help
          docker run --rm --network none ultrafast-atif-helper:ci --version
